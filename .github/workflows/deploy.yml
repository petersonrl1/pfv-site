name: CI / Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Check server before replacing the live build
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            export NVM_DIR="$HOME/.nvm"
            . "$NVM_DIR/nvm.sh" --no-use
            nvm use default
            command -v npm
            command -v pm2
            cd /var/www/provfairview.church
            test -z "$(git status --porcelain)" || { echo "Server checkout has local changes; deployment stopped before replacing the build."; exit 1; }
            git fetch origin main
            git merge-base --is-ancestor HEAD '${{ github.sha }}'

      - name: Copy build to server
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            .next/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/provfairview.church/.next/

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            export NVM_DIR="$HOME/.nvm"
            . "$NVM_DIR/nvm.sh" --no-use
            nvm use default
            cd /var/www/provfairview.church
            git merge --ff-only '${{ github.sha }}'
            npm ci --omit=dev
            pm2 restart pfv-site
            curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-all-errors http://localhost:3000/ > /dev/null
